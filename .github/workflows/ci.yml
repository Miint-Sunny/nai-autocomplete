name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and validate bundles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build modular bundles
        run: node scripts/build-modular.mjs

      - name: Check theme tokens
        run: node scripts/check-theme-tokens.mjs

      - name: Test LLM service
        run: node scripts/test-llm.mjs

      - name: Test prompt agent
        run: node scripts/test-agent.mjs

      - name: Test tag flow model
        run: node scripts/test-flow.mjs

      - name: Test prompt overlay offsets
        run: node scripts/test-content.mjs

      - name: Test build integrity
        run: node scripts/test-build.mjs

      - name: Validate release package
        run: node scripts/package.mjs

      - name: Validate manifest
        run: node -e "const manifest = require('./manifest.json'); if (!manifest.version) throw new Error('manifest.json is missing version');"
