name: Release Extension

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.5.1. Defaults to manifest.json version."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package and upload release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 打包脚本用到 fs.readdirSync({recursive}) 和 fs.cpSync，别指望 runner 默认版本
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read manifest version
        id: manifest
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          MANIFEST_VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tag="v$MANIFEST_VERSION"
          else
            tag="v$MANIFEST_VERSION"
          fi

          expected="v$MANIFEST_VERSION"
          if [[ "$tag" != "$expected" ]]; then
            echo "::warning::Release tag $tag does not match manifest version $MANIFEST_VERSION."
          fi

          archive_name="nai-autocomplete-${tag}.zip"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Skip existing main release
        id: release_gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping packaging."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package extension
        if: steps.release_gate.outputs.skip != 'true'
        shell: bash
        run: node scripts/package.mjs --zip

      - name: Upload release
        if: steps.release_gate.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE_NAME: ${{ steps.release.outputs.archive_name }}
        run: |
          set -euo pipefail

          asset_path="dist/$ARCHIVE_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset_path" --clobber
          else
            {
              echo "## 安装"
              echo "1. 下载 \`$ARCHIVE_NAME\`"
              echo "2. 解压到一个固定目录（之后别删，扩展是从这里加载的）"
              echo "3. Chrome / Edge 打开 \`chrome://extensions\`，右上角开「开发者模式」"
              echo "4. 点「加载已解压的扩展程序」，选解压出来的 \`nai-autocomplete\` 文件夹"
              echo
              echo "首次在 novelai.net 使用时会自动拉取 danbooru 标签词典并缓存，需要能访问 GitHub。"
              echo
              echo "## 变更"
              echo "见提交记录与仓库内的 README / STYLE / LLM / AGENT / FLOW 文档。"
            } > release-notes.md
            gh release create "$TAG" "$asset_path" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
